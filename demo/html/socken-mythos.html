<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Wohin verschwinden die Socken?</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a2e; color: #eee; font-family: "Courier New", monospace; overflow: hidden; }
  .slide { position: absolute; inset: 0; padding: 6vw; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center;
           opacity: 0; filter: blur(12px); transition: all .5s; }
  .slide.on { opacity: 1; filter: none; }
  h1 { font-size: 5.5vw; color: #73d95f; margin: 0 0 2vw; }
  p { font-size: 3vw; }
  .sock { position: absolute; font-size: 6vw; animation: fly 6s linear infinite; }
  @keyframes fly { from { transform: translate(-10vw, 80vh) rotate(0); } to { transform: translate(110vw, -20vh) rotate(720deg); } }
  .stamp { display: inline-block; border: .5vw solid #ff7070; color: #ff7070; padding: 1vw 3vw; font-size: 6vw; transform: rotate(-12deg); }
</style>
</head>
<body>
<section class="slide"><h1>&gt; Wohin verschwinden die Socken?_</h1><p>Ein Mythos im Faktencheck</p><span class="sock">🧦</span></section>
<section class="slide"><h1>Hypothese A</h1><p>Die Waschmaschine isst sie.</p><p>Beweislage: Waschmaschine schweigt.</p></section>
<section class="slide"><h1>Hypothese B</h1><p>Paralleluniversum.</p><p>Dort gibt es nur einzelne Socken – und sie suchen uns.</p></section>
<section class="slide"><h1>Ergebnis</h1><span class="stamp">UNGEKLÄRT</span><p>Weitere Forschungsgelder beantragt.</p><span class="sock" style="animation-delay:-2s">🧦</span><span class="sock" style="animation-delay:-4s">🧦</span></section>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let i = 0;
  const show = () => slides.forEach((s, k) => s.classList.toggle('on', k === i));
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) i = Math.max(0, i - 1);
    else return;
    e.preventDefault(); show();
  });
  document.addEventListener('click', (e) => { i = e.clientX < innerWidth / 3 ? Math.max(0, i - 1) : Math.min(slides.length - 1, i + 1); show(); });
  show();
</script>
</body>
</html>
