<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mein perfekter Sonntag</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffd000; color: #000; font-family: Arial Black, Arial, sans-serif; overflow: hidden; }
  .slide { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 5vw; box-sizing: border-box;
           clip-path: circle(0% at 50% 50%); transition: clip-path .7s ease; background: inherit; }
  .slide.on { clip-path: circle(150% at 50% 50%); z-index: 1; }
  .slide:nth-child(even) { background: #000; color: #ffd000; }
  h1 { font-size: 7vw; margin: 0; }
  p { font-size: 3.4vw; font-family: Arial, sans-serif; }
  .clock { font-size: 12vw; }
</style>
</head>
<body>
<section class="slide"><div><h1>Mein perfekter Sonntag</h1><p>Ein minutengenauer Ablaufplan</p></div></section>
<section class="slide"><div><div class="clock">11:30</div><p>Aufwachen. Nicht aufstehen.</p></div></section>
<section class="slide"><div><div class="clock">13:00</div><p>Frühstück, das eigentlich Mittagessen ist.</p></div></section>
<section class="slide"><div><div class="clock">15:00</div><p>Spaziergang (bis zum Sofa).</p></div></section>
<section class="slide"><div><div class="clock">22:59</div><p>Plötzliche Erkenntnis: Morgen ist Montag.</p></div></section>
<section class="slide"><div><h1>Danke! 🛋️</h1></div></section>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let i = 0;
  const show = () => slides.forEach((s, k) => s.classList.toggle('on', k === i));
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) i = Math.max(0, i - 1);
    else return;
    e.preventDefault(); show();
  });
  document.addEventListener('click', (e) => { i = e.clientX < innerWidth / 3 ? Math.max(0, i - 1) : Math.min(slides.length - 1, i + 1); show(); });
  show();
</script>
</body>
</html>
